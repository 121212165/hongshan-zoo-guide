<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; overflow:hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: linear-gradient(135deg, #1a3d2e 0%, #2d5a3d 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff;
  }
  .leaf { font-size:64px; margin-bottom:20px; }
  h1 { font-size:54px; font-weight:800; letter-spacing:3px; margin-bottom:36px; }
  .points { display:flex; flex-direction:column; gap:14px; margin-bottom:48px; }
  .pt { font-size:24px; opacity:0.92; display:flex; align-items:center; gap:12px; }
  .pt .check { color:#7ec699; font-size:28px; }
  .slogan { font-size:22px; opacity:0.7; font-weight:300; letter-spacing:2px; }
</style>
</head>
<body>
  <div class="leaf">🍃</div>
  <h1>红山朋友</h1>
  <div class="points">
    <div class="pt"><span class="check">✓</span> 评测门禁通过 · 平均分 1.93</div>
    <div class="pt"><span class="check">✓</span> 全离线确定性 · 零 API 成本</div>
    <div class="pt"><span class="check">✓</span> 规划 / 陪逛 / 手账 三标签</div>
    <div class="pt"><span class="check">✓</span> 动物福利立场铁律</div>
  </div>
  <div class="slogan">陪你按自己的方式，逛出自己的红山</div>
</body>
</html>
