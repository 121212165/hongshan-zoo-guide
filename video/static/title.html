<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; overflow:hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: linear-gradient(135deg, #1a3d2e 0%, #2d5a3d 50%, #3d6b4d 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff;
  }
  .leaf { font-size:80px; margin-bottom:24px; }
  h1 { font-size:72px; font-weight:800; letter-spacing:4px; margin-bottom:16px; text-shadow:0 4px 20px rgba(0,0,0,0.3); }
  .sub { font-size:28px; opacity:0.85; font-weight:300; letter-spacing:2px; }
  .tag { margin-top:48px; padding:10px 24px; border:1px solid rgba(255,255,255,0.3); border-radius:999px; font-size:18px; opacity:0.7; }
</style>
</head>
<body>
  <div class="leaf">🍃</div>
  <h1>红山朋友 · 陪逛 Agent</h1>
  <div class="sub">南京红山森林动物园 · 省力导览 Agent</div>
  <div class="tag">演示视频</div>
</body>
</html>
