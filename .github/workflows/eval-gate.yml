name: eval-gate

# 红山省力 Agent · CI 门禁流水线
# 职责划分：
#   GitHub Actions (本文件)：lint + typecheck + build + eval 门禁
#   Vercel：仅负责发布部署（不做质量门禁）
#
# 三档：
#   lint   —— 静态检查 + 类型检查 + 构建验证，PR 与 main 都跑
#   subset —— PR 触发，stub 模式跑前 20 题子集，快速反馈
#   full   —— main 合并触发，stub 模式跑全量 50 题，门禁阈值同 run_eval.ts

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'evals/**'
      - '.github/workflows/eval-gate.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'evals/**'
      - '.github/workflows/eval-gate.yml'

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + TypeCheck + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run lint (src/ only)
        run: npm run lint
      - name: Run typecheck
        run: npm run typecheck
      - name: Verify build
        run: npm run build

  subset:
    name: Eval Subset (PR gate)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run subset eval (stub · 20 题)
        run: npm run eval:subset

  full:
    name: Eval Full (main gate)
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run full eval (stub · 50 题)
        run: npm run eval
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: evals/reports/
          retention-days: 30
